<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Associação Oásis de Pompéia</title>
  <meta name="description" content="Arte, esporte, inclusão e oportunidades para crianças e adolescentes de 4 a 17 anos em Pompéia/SP.">
  <meta name="theme-color" content="#F47721">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/firebase-config.js"></script>
  <!-- Arquivo único (gerado a partir da pasta js/): abre com dois cliques no index.html. -->
  <script src="js/site.bundle.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div class="a11y-bar" role="region" aria-label="Recursos de acessibilidade">
    <div class="wrap">
      <span>Acessibilidade:</span>
      <button type="button" id="toggle-contrast" aria-pressed="false">Alto contraste</button>
      <button type="button" id="font-dec" aria-label="Diminuir texto">A−</button>
      <button type="button" id="font-reset" aria-label="Tamanho de texto padrão">A</button>
      <button type="button" id="font-inc" aria-label="Aumentar texto">A+</button>
      <a href="#/acessibilidade">Libras e recursos</a>
      <span id="a11y-live" class="visually-hidden" aria-live="polite"></span>
    </div>
  </div>
  <header class="site" id="site-header"></header>
  <main id="conteudo" tabindex="-1">
    <div id="hero"></div>
    <div class="wrap">
      <div id="flashes" role="status" aria-live="polite" class="flashes"></div>
      <div id="page"><p class="muted" style="padding:3rem 0">Carregando…</p></div>
    </div>
  </main>
  <footer class="site" id="site-footer"></footer>
  <!-- VLibras: tradução automática para Libras (Governo Federal). Precisa de internet. -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js" defer></script>
  <script>window.addEventListener("load", function () { try { if (window.VLibras) new window.VLibras.Widget("https://vlibras.gov.br/app"); } catch (e) { console.warn("VLibras indisponível", e); } });</script>
  <noscript><p style="padding:1rem">Este site precisa de JavaScript ativado.</p></noscript>
</body>
</html>
